# ~/.config/systemd/user/rex.service.d/override.conf
#
# Drop-in for the Rex package's systemd user unit
# (/usr/lib/systemd/user/rex.service) on Linux. It keeps the default local
# Unix socket and also serves Rex on the host's tailnet addresses, port 7297,
# through the host's tailscaled. Rex clients on other tailnet devices (e.g.
# the Rex macOS app) can then add this machine as host
# "<hostname>.<tailnet>.ts.net" (no https://, no cert needed; 7297 is Rex's
# default port).
#
# tailnet:// identifies each caller through tailscaled's LocalAPI and by
# default admits only the node owner. Connections from this host's own
# tailnet address are refused by design, so test from another tailnet device:
#
#   rex -S <hostname>.<tailnet>.ts.net:7297 ls
#
# Install:
#
#   mkdir -p ~/.config/systemd/user/rex.service.d
#   cp -f ~/dotfiles/rex/rex.service.d/override.conf \
#         ~/.config/systemd/user/rex.service.d/
#   systemctl --user daemon-reload
#   systemctl --user restart rex.service   # running programs in sessions end
#   rex server status                      # shows a tailnet://:7297 listener

[Service]
ExecStart=
ExecStart=/usr/bin/rex server run --log-format text --extra-listen tailnet://:7297
